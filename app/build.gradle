plugins { id 'com.android.application' }

android {
    namespace 'com.ssg.securityguard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ssg.securityguard'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
